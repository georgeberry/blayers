[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blayers"
version = "0.3.2"
description = "Bayesian layers for NumPyro and Jax"
authors = [{ name = "George Berry", email = "george.e.berry@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "jax",
    "numpyro",
    "optax",
]

[project.urls]
Homepage = "https://github.com/georgeberry/blayers"
Documentation = "https://georgeberry.github.io/blayers/"

[project.optional-dependencies]
arviz = [
    # arviz 1.x: nested from_dict API + PSIS-LOO (WAIC dropped upstream).
    "arviz>=1.0",
]
dev = [
    "optax",
    "arviz>=1.0",
    "pytest",
    "pytest-check",
    "pytest-xdist",
    "mypy",
    "black",
    "isort",
    "autoflake",
    "sphinx",
    "sphinx-book-theme",
    "furo",
    "coverage",
    "pytest-cov",
    "pre-commit",
    "myst-parser",
]

[tool.setuptools.packages.find]
where = ["."]
# Package only the library — without this, tests/ (it has an __init__.py) and
# docs/ leak into the wheel and pollute users' site-packages.
include = ["blayers*"]

[tool.mypy]
strict = true
ignore_missing_imports = true
explicit_package_bases = true
disable_error_code = ["misc"]

[tool.isort]
profile = "black"
line_length = 80
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0

[tool.black]
line-length = 80
target-version = ["py312"]

[tool.ruff]
ignore = ["E731"]
