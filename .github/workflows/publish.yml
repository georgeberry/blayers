name: Publish to PyPI

# Fires when a GitHub Release is published (the deliberate "cut a release" action),
# plus a manual trigger for backfills. This is more reliable than gating a raw tag
# push on `github.event.base_ref`, which is empty when a tag is created via the
# Release UI and silently skips the job.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
