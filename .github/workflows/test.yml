on: ["push", "pull_request"]

name: Test Coveralls

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -e .[dev]  # pytest, pytest-cov
          pip install coveralls

      - name: Run tests with coverage
        # -n auto parallelizes across runner cores; the suite is dominated by
        # independent, per-test VI/MCMC fits, so distributing individual tests
        # (xdist's default) spreads the slow parametrized cases across workers.
        run: pytest -n auto --cov=blayers --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: coveralls --service=github
